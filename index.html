<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibe Starter</title>
    <style>
      /* One file, zero build. The tutorial's target is the <h1> below:
         change its text, change its color, refresh the browser. */
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        color: #0f172a;
        font-size: 2.2rem;
        line-height: 1.2;
      }
      p {
        color: #475569;
        max-width: 34rem;
      }
      a {
        color: #0369a1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This headline is waiting for your first agent</h1>
      <p>
        A one-page starter for the <em>Set up your machine for vibe coding</em>
        series. Open this file in a browser, ask your agent to change the
        headline, refresh, and smile.
      </p>
      <p>
        <a href="https://napjose.ph/writing/vibe-coding-machine"
          >napjose.ph/writing/vibe-coding-machine</a
        >
      </p>
    </main>
  </body>
</html>
